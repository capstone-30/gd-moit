<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">모잇 헥사고날 아키텍처</title>
  <desc id="desc">입력 어댑터가 Application 유스케이스를 호출하고 Application은 Domain에 의존한다. 출력 어댑터는 Application에 정의된 포트를 구현한다. 화살표는 코드 의존 방향이며 실행 흐름과 다르다. composition.ts와 CLI 진입점이 실제 구현을 주입한다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#345bb5"/></marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; fill: #202b3c; }
    .title { font-size: 28px; font-weight: 700; }
    .heading { font-size: 22px; font-weight: 700; }
    .body { font-size: 17px; }
    .small { font-size: 15px; fill: #596579; }
    .blue { fill: #345bb5; }
    .dependency { fill: none; stroke: #345bb5; stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <rect width="1200" height="620" rx="18" fill="#f5f7fb"/>
  <text x="40" y="54" class="title">모잇 · 헥사고날 아키텍처</text>
  <text x="40" y="86" class="body">업무 규칙은 안쪽에, 기술 구현은 바깥쪽에</text>

  <polygon points="450,134 750,134 850,300 750,466 450,466 350,300" fill="#eaf0fc" stroke="#9bb2df" stroke-width="2"/>
  <text x="600" y="172" text-anchor="middle" class="small blue">APPLICATION CORE</text>
  <text x="600" y="211" text-anchor="middle" class="heading">Application · 유스케이스</text>
  <text x="600" y="240" text-anchor="middle" class="body">인증 · 모임 · 서류 · 보관·삭제</text>
  <path d="M600 252V282" class="dependency"/>

  <rect x="465" y="290" width="270" height="78" rx="12" fill="#fff" stroke="#9bb2df"/>
  <text x="600" y="322" text-anchor="middle" class="heading">Domain · 업무 규칙</text>
  <text x="600" y="348" text-anchor="middle" class="small">backend/domain</text>

  <rect x="445" y="389" width="310" height="58" rx="10" fill="#fff" stroke="#9bb2df"/>
  <text x="600" y="414" text-anchor="middle" class="body blue">출력 포트 · DB / Transaction / Delivery</text>
  <text x="600" y="436" text-anchor="middle" class="small">Runtime / AccessAudit · application/ports.ts</text>

  <rect x="40" y="184" width="260" height="232" rx="12" fill="#fff" stroke="#d3dbe8"/>
  <text x="62" y="221" class="heading">입력 어댑터</text>
  <text x="62" y="259" class="body">HTTP API</text>
  <text x="62" y="283" class="small">backend/adapters/http</text>
  <text x="62" y="320" class="body">Next.js 서버 화면 · 세션</text>
  <text x="62" y="344" class="small">frontend/app</text>
  <text x="62" y="382" class="body">운영 CLI · backend/scripts</text>
  <path d="M300 240H455" class="dependency"/>
  <text x="337" y="228" class="small blue">호출</text>

  <rect x="900" y="184" width="260" height="232" rx="12" fill="#fff" stroke="#d3dbe8"/>
  <text x="922" y="221" class="heading">출력 어댑터</text>
  <text x="922" y="259" class="body">저장소 · PostgreSQL</text>
  <text x="922" y="294" class="body">메일 · SMTP</text>
  <text x="922" y="329" class="body">삭제 전달 · 접근 감사</text>
  <text x="922" y="364" class="body">보안 · 해시·토큰</text>
  <text x="922" y="392" class="small">backend/adapters</text>
  <path d="M900 300H873V418H765" class="dependency" stroke-dasharray="6 5"/>
  <text x="785" y="447" class="small blue">포트 구현</text>

  <rect x="40" y="494" width="1120" height="60" rx="10" fill="#fff" stroke="#d3dbe8"/>
  <text x="62" y="520" class="body">조립 · backend/composition.ts + CLI 진입점</text>
  <text x="62" y="542" class="small">실제 어댑터를 생성해 유스케이스에 주입 · Application → Domain · 두 계층은 어댑터에 의존하지 않음</text>
  <path d="M42 585H85" class="dependency"/>
  <text x="98" y="591" class="small">코드 의존 방향</text>
  <path d="M260 585H303" class="dependency" stroke-dasharray="6 5"/>
  <text x="316" y="591" class="small">포트 구현 · 타입 의존</text>
</svg>
