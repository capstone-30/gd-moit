    <text x="24" y="233" class="role">SMTP</text>
    <text x="24" y="264" class="body">학교 이메일 인증번호 발송</text>
    <text x="24" y="315" class="role">삭제 전달 · 접근 감사</text>
    <text x="24" y="346" class="body">외부 수신부 연동 · 운영 연결 대기</text>
