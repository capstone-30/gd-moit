name: docs

on:
  pull_request:
    paths: ['**.md', '.github/scripts/check_docs.py', '.github/workflows/docs.yml']
  push:
    branches: [main]
    paths: ['**.md', '.github/scripts/check_docs.py', '.github/workflows/docs.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 .github/scripts/check_docs.py
